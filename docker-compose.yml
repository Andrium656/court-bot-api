services:
  redis:
    image: redis:7-alpine
    container_name: court-bot-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - court-bot-network
    environment:
      - TZ=America/Bogota
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: court-bot-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
    volumes:
      - ./logs:/app/logs
      - ./bot_state.json:/app/bot_state.json
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - court-bot-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: court-bot-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
    volumes:
      - ./logs:/app/logs
      - ./bot_state.json:/app/bot_state.json
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - court-bot-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: court-bot-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
    volumes:
      - ./logs:/app/logs
      - ./bot_state.json:/app/bot_state.json
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - court-bot-network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: court-bot-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
    command: celery -A app.celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - court-bot-network

volumes:
  redis_data:
    driver: local

networks:
  court-bot-network:
    driver: bridge